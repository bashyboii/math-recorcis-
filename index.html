<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Desmos</title>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="background"></div>
    <p>Choose a game/site to play:</p>

    <nav class="game-links">
      <a href="drivemad.html">Drive Mad</a>	
      <a href="RagdollArchers.html">Ragdoll Archers</a>
      <a href="Proxy.html">Monke</a>
      <a href="escaperoad.html">Escape Road</a>
      <a href="stickman.html">Stickman Swing</a>
      <a href="bitlife.html">Bitlife</a>
      <a href="driftboss.html">Drift Boss</a>
    </nav>

    <h1>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLScj0X9isHWJpoDV6DhF6f2RGxCGBwWgpCUicBm5dUHSSNEVbw/viewform?usp=header" target="_blank"
        >SUBMIT GAME IDEAS HERE WILL TRY TO ADD</a
  >
    </h1>
    <script>
      // Generate stars dynamically
      const numStars = 2300;
      const background = document.getElementById('background');

      for (let i = 0; i < numStars; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        const size = Math.random() * 3;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${Math.random() * 100}vw`;
        star.style.top = `${Math.random() * 100}vh`;

        // Randomize animation delay for natural look
        star.style.animationDelay = `${Math.random() * 5}s`;

        background.appendChild(star);
      }
    </script>
  </body>

</html>
